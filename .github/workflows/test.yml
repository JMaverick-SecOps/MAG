name: Test MAG
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - run: npm ci
      - run: npm run check
      - run: python3 -m unittest discover -s test -p test_migration_mail.py
      - run: npx wrangler deploy --dry-run

